name: enterprise-api-gateway

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  orders-mock:
    image: python:3.12-slim
    environment:
      MOCK_SERVICE: orders
    volumes:
      - ./docker/mock/server.py:/mock/server.py:ro
    command: ["python", "/mock/server.py"]
    ports:
      - "127.0.0.1:8081:8080"

  customers-mock:
    image: python:3.12-slim
    environment:
      MOCK_SERVICE: customers
    volumes:
      - ./docker/mock/server.py:/mock/server.py:ro
    command: ["python", "/mock/server.py"]
    ports:
      - "127.0.0.1:8082:8080"

  gateway:
    build:
      context: .
      dockerfile: ${GATEWAY_DOCKERFILE:-Dockerfile}
    image: enterprise-api-gateway:local
    depends_on:
      redis:
        condition: service_healthy
      orders-mock:
        condition: service_started
      customers-mock:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      REDIS_HOST: redis
      LOCAL_DEV_TOKENS: ${LOCAL_DEV_TOKENS:-false}
      LOCAL_DEV_TOKEN_SECRET: ${LOCAL_DEV_TOKEN_SECRET:-}
      WSO2_ISSUER_URI: ${WSO2_ISSUER_URI:-https://host.docker.internal:9443/oauth2/token}
      WSO2_REQUIRED_AUDIENCE: ${WSO2_REQUIRED_AUDIENCE:-}
      WSO2_JWKS_URI: ${WSO2_JWKS_URI:-https://host.docker.internal:9443/oauth2/jwks}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      ORDERS_SERVICE_URI: http://orders-mock:8080
      CUSTOMERS_SERVICE_URI: http://customers-mock:8080
      GATEWAY_ROUTE_ALLOWED_HOSTS: ${GATEWAY_ROUTE_ALLOWED_HOSTS:-orders-mock,customers-mock}
      GATEWAY_ROUTE_ALLOW_LOOPBACK: ${GATEWAY_ROUTE_ALLOW_LOOPBACK:-false}
      ORDERS_RATE_LIMIT_REPLENISH: ${ORDERS_RATE_LIMIT_REPLENISH:-20}
      ORDERS_RATE_LIMIT_BURST: ${ORDERS_RATE_LIMIT_BURST:-40}
      CUSTOMERS_RATE_LIMIT_REPLENISH: ${CUSTOMERS_RATE_LIMIT_REPLENISH:-30}
      CUSTOMERS_RATE_LIMIT_BURST: ${CUSTOMERS_RATE_LIMIT_BURST:-60}
    restart: unless-stopped

volumes:
  redis-data:
