server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: enterprise-api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WSO2_ISSUER_URI:https://localhost:9443/oauth2/token}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders-service
              uri: ${ORDERS_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${ORDERS_RATE_LIMIT_REPLENISH:20}
                    redis-rate-limiter.burstCapacity: ${ORDERS_RATE_LIMIT_BURST:40}
                    key-resolver: "#{@principalKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: ordersCircuitBreaker
                    fallbackUri: forward:/fallback/orders
            - id: customers-service
              uri: ${CUSTOMERS_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/customers/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${CUSTOMERS_RATE_LIMIT_REPLENISH:30}
                    redis-rate-limiter.burstCapacity: ${CUSTOMERS_RATE_LIMIT_BURST:60}
                    key-resolver: "#{@principalKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: customersCircuitBreaker
                    fallbackUri: forward:/fallback/customers
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

security:
  jwt:
    jwk-set-uri: ${WSO2_JWKS_URI:}
    audience: ${WSO2_REQUIRED_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 70
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      ordersCircuitBreaker:
        base-config: default
      customersCircuitBreaker:
        base-config: default

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
