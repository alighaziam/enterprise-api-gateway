<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger · Enterprise API Gateway</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/5.21.0/swagger-ui.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a12'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%23e0b15a' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: Vazirmatn;
      src: url("/fonts/Vazirmatn-wght.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    html { box-sizing: border-box; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
    .swagger-ui { font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif; }
    .swagger-ui .info .description,
    .swagger-ui .opblock-summary-description,
    .swagger-ui .opblock-description-wrapper,
    .swagger-ui .renderedMarkdown,
    .swagger-ui .response-col_description {
      font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
      unicode-bidi: plaintext;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="/webjars/swagger-ui/5.21.0/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      displayRequestDuration: true,
      persistAuthorization: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  </script>
</body>
</html>
