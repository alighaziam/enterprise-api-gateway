name: Hourly PR Guardian

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: hourly-pr-guardian-${{ github.repository }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Merge only verified, review-approved PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GH_REPO"
          prs="$(gh pr list --repo "$repo" --state open --json number,isDraft,mergeable,mergeStateStatus,reviewDecision --jq '.[] | select(.isDraft == false and .mergeable == true and .mergeStateStatus == "CLEAN" and (.reviewDecision == null or .reviewDecision == "APPROVED")) | .number')"

          if [[ -z "$prs" ]]; then
            echo "No PR currently satisfies the mergeability, clean-state, and review-decision gates."
            exit 0
          fi

          while IFS= read -r pr; do
            [[ -z "$pr" ]] && continue
            echo "Checking PR #$pr in $repo"

            if ! checks_json="$(gh pr checks "$pr" --repo "$repo" --json state 2>&1)"; then
              echo "Checks are pending, failing, or unavailable; skipping PR #$pr."
              continue
            fi

            if ! printf '%s' "$checks_json" | jq -e 'type == "array" and length > 0 and all(.[]; .state == "SUCCESS")' >/dev/null; then
              echo "At least one check is not successful or no checks were reported; skipping PR #$pr."
              continue
            fi

            echo "All reported checks passed. Attempting squash merge; GitHub still enforces repository rules and required reviews."
            if ! gh pr merge "$pr" --repo "$repo" --squash; then
              echo "GitHub blocked the merge for PR #$pr; no force merge was attempted."
            fi
          done <<< "$prs"
