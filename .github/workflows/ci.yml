name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and smoke test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag enterprise-api-gateway:${{ github.sha }} .

      - name: Start local integration stack
        run: |
          docker tag enterprise-api-gateway:${{ github.sha }} enterprise-api-gateway:local
          docker compose up -d --no-build

      - name: Smoke test gateway, security and WireMock backends
        shell: bash
        run: |
          set -euo pipefail

          health_file="$(mktemp)"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:8080/actuator/health > "$health_file"; then
              break
            fi
            sleep 2
          done
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "UP"' "$health_file"

          status="$(curl --silent --output /tmp/unauthorized-body.json --dump-header /tmp/unauthorized-headers.txt --write-out '%{http_code}' http://localhost:8080/api/orders/ci-smoke)"
          test "$status" = "401"
          grep -qi '^X-Correlation-ID:' /tmp/unauthorized-headers.txt

          orders_ok=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:8081/orders/ci-smoke | python3 -c 'import json,sys; assert json.load(sys.stdin)["service"] == "orders"'; then
              orders_ok=true
              break
            fi
            sleep 2
          done
          test "$orders_ok" = true

          customers_ok=false
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://localhost:8082/customers/ci-smoke | python3 -c 'import json,sys; assert json.load(sys.stdin)["service"] == "customers"'; then
              customers_ok=true
              break
            fi
            sleep 2
          done
          test "$customers_ok" = true

      - name: Show integration logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop local integration stack
        if: always()
        run: docker compose down -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
