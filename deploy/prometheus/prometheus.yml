global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/gateway-alerts.yml

scrape_configs:
  - job_name: enterprise-api-gateway
    metrics_path: /actuator/prometheus
    scheme: http
    scrape_interval: 30s
    static_configs:
      - targets:
          - gateway:8080
    # Mount a short-lived WSO2 bearer token with gateway.admin at this path.
    # Never commit the token or bake it into the image.
    bearer_token_file: /etc/prometheus/secrets/gateway-admin-token
